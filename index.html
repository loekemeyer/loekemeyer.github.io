<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>Loekemeyer</title>
<style>
  /* Indice del sitio. Existe para mandar sobre el listado que Pages arma solo: ahi
     seguia figurando "Monitor-Virgilio", que es el nombre viejo del monitor de
     matriceria (se renombro el 16/09/2026). */
  :root{color-scheme:light dark}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,'Segoe UI',system-ui,Arial,sans-serif;
       background:#fff;color:#1f2328;padding:28px 20px;max-width:640px;margin:0 auto;line-height:1.5}
  h1{font-size:28px;margin-bottom:4px}
  .sub{color:#636c76;font-size:15px;margin-bottom:26px}
  ul{list-style:none;display:flex;flex-direction:column;gap:12px}
  a.item{display:block;border:1px solid #d0d7de;border-radius:10px;padding:16px 18px;
         text-decoration:none;color:inherit}
  a.item:hover{border-color:#0969da}
  a.item b{display:block;font-size:19px;color:#0969da;margin-bottom:2px}
  a.item span{font-size:14px;color:#636c76}
  @media (prefers-color-scheme:dark){
    body{background:#0d1117;color:#e6edf3}
    a.item{border-color:#30363d}
    a.item b{color:#4493f8}
    a.item span,.sub{color:#9198a1}
  }
</style>
</head>
<body>
  <h1>Loekemeyer</h1>
  <p class="sub">Paginas publicadas.</p>
  <ul>
    <li>
      <a class="item" href="./Monitor-Matriceria/">
        <b>Monitor Matriceria</b>
        <span>TV del taller: matrices en matriceria y unidades sin accidente por matriz.</span>
      </a>
    </li>
  </ul>
</body>
</html>
